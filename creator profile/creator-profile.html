    <!-- SIDEBAR ("Creators" stays the active item) -->

            <svg viewBox="225 425 630 240" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
                <use href="#twigg-logo" />
            </svg>
        </div>

        <button class="filter-button" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">

                <rect x="12" y="4" width="10" height="3" rx="1.5" />
                <rect x="12" y="9" width="8" height="3" rx="1.5" />
                <rect x="12" y="14" width="6" height="3" rx="1.5" />
                <rect x="12" y="19" width="4" height="3" rx="1.5" />
            </svg>
            <span>Filter &amp; Sort</span>
        </button>

        <nav class="navigation">

            <a href="../home/home.html" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 11L12 4l9 7" />

                </svg>
                <span>Home</span>
            </a>

            <a href="../reels/reels.html" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="16" height="16" rx="3" />
                    <path d="M10 9l5 3-5 3z" />
                </svg>
                <span>Twigg Reels</span>

            <a href="../creators/creators.html" class="nav-item active">

                    <circle cx="5" cy="8" r="1.8" />

    <!-- MAIN CONTENT -->

    <main class="main">

        <!-- MOBILE TOP BAR (mobile only) -->

        <header class="mobile-topbar">

            <div class="mobile-topbar-logo">
                <svg viewBox="225 425 630 240" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
                    <use href="#twigg-logo" />
                </svg>
            </div>

            <div class="mobile-topbar-actions">

                <a href="#" class="mobile-topbar-icon" aria-label="Create">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round">
                        <circle cx="12" cy="12" r="8" />
                        <path d="M12 8v8" />
                        <path d="M8 12h8" />
                    </svg>
                </a>

                <a href="#" class="mobile-topbar-icon" aria-label="Notification">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 17h12l-1.5-3V10a4.5 4.5 0 0 0-9 0v4z" />
                        <path d="M10 20h4" />
                    </svg>
                </a>

            </div>

        </header>


        <!-- PROFILE (filled by creator-profile.js) -->

        <div id="cpRoot" hidden>

            <section class="cp-header">

                <div class="cp-cover" id="cpCover">

                    <button class="cp-round cp-back" id="cpBack" type="button" aria-label="Go back">
                        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg>
                    </button>

                    <button class="cp-round cp-report" id="cpReport" type="button" aria-pressed="false" aria-label="Report this creator" title="Report">
                        <svg viewBox="0 0 24 24"><path d="M6 3v18"></path><path d="M6 4h11l-2.5 4L17 12H6"></path></svg>
                    </button>

                </div>

                <div class="cp-info">

                    <div class="cp-avatar" id="cpAvatar"></div>

                    <div class="cp-meta">
                        <h1 class="cp-name" id="cpName"></h1>
                        <div class="cp-category" id="cpCategory"></div>
                        <div class="cp-rating" id="cpRating"></div>
                        <p class="cp-bio" id="cpBio"></p>
                    </div>

                    <div class="cp-actions">

                        <button class="cp-icon-btn" id="cpSave" type="button" aria-pressed="false" aria-label="Save creator" title="Save">
                            <svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"></path></svg>
                        </button>

                        <button class="cp-icon-btn" id="cpShare" type="button" aria-label="Share profile" title="Share">
                            <svg viewBox="0 0 24 24"><path d="M12 16V4"></path><path d="M7 9l5-5 5 5"></path><path d="M5 13v6h14v-6"></path></svg>
                        </button>

                        <a class="cp-message" id="cpMessage" href="../message/message.html">
                            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M7 9l5 4 5-4"></path></svg>
                            <span>Message</span>
                        </a>

                    </div>

                </div>

            </section>


            <!-- TABS: only ONE panel is visible at a time -->

            <nav class="cp-tabs" id="cpTabs" role="tablist" aria-label="Creator sections">

                <button class="cp-tab" type="button" role="tab" id="tab-feed" data-tab="feed" aria-controls="panel-feed" aria-selected="true">
                    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg>
                    <span>Feed</span>
                </button>

                <button class="cp-tab" type="button" role="tab" id="tab-packages" data-tab="packages" aria-controls="panel-packages" aria-selected="false" tabindex="-1">
                    <svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M4 7.5l8 4.5 8-4.5"></path><path d="M12 12v9"></path></svg>
                    <span>Packages &amp; Pricing</span>
                </button>

                <button class="cp-tab" type="button" role="tab" id="tab-reviews" data-tab="reviews" aria-controls="panel-reviews" aria-selected="false" tabindex="-1">
                    <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.5 6.1 20.7l1.2-6.6L2.5 9.5l6.6-.9z"></path></svg>
                    <span>Ratings &amp; Reviews</span>
                </button>

                <button class="cp-tab" type="button" role="tab" id="tab-services" data-tab="services" aria-controls="panel-services" aria-selected="false" tabindex="-1">
                    <svg viewBox="0 0 24 24"><rect x="3.5" y="7" width="17" height="12" rx="2.5"></rect><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"></path><path d="M3.5 12.5h17"></path></svg>
                    <span>Other Services</span>
                </button>

            </nav>

            <section class="cp-panel" id="panel-feed" role="tabpanel" aria-labelledby="tab-feed"></section>
            <section class="cp-panel" id="panel-packages" role="tabpanel" aria-labelledby="tab-packages" hidden></section>
            <section class="cp-panel" id="panel-reviews" role="tabpanel" aria-labelledby="tab-reviews" hidden></section>
            <section class="cp-panel" id="panel-services" role="tabpanel" aria-labelledby="tab-services" hidden></section>

        </div>


        <!-- CREATOR NOT FOUND -->

        <div class="cp-empty cp-notfound" id="cpNotFound" hidden>
            <h2>Creator not found</h2>
            <p>This profile doesn't exist or the link is incomplete.</p>
            <a class="cp-message" href="../creators/creators.html"><span>Browse creators</span></a>
        </div>

    </main>


    <!-- POST VIEWER (vertical scroll through this creator's posts) -->

    <div class="cp-viewer" id="cpViewer" hidden role="dialog" aria-label="Creator posts">
        <header class="cp-viewer-bar">
            <button class="cp-round cp-viewer-back" id="cpViewerBack" type="button" aria-label="Back to profile">
                <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg>
            </button>
            <strong id="cpViewerTitle">Posts</strong>
        </header>
        <div class="cp-viewer-scroll" id="cpViewerScroll"></div>
    </div>

    <div class="cp-toast" id="cpToast" role="status" aria-live="polite"></div>


    <script src="../shared/categories.js"></script>
    <script src="../shared/media-data.js"></script>
    <script src="../shared/skeleton.js"></script>
    <script src="creator-profile.js"></script>
    <script src="../filter/filter.js"></script>
    <script src="../notification/notification.js"></script>

</body>
