<svg xmlns="http://w3.org" viewBox="0 0 500 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f7" />
    </linearGradient>

    <!-- Complex Gradients for Folds -->
    <linearGradient id="top-fold" x1="30%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffccd5" />
      <stop offset="30%" stop-color="#fbc3bc" />
      <stop offset="60%" stop-color="#bbf2f6" />
      <stop offset="85%" stop-color="#cfbaf0" />
      <stop offset="100%" stop-color="#a3c4f3" />
    </linearGradient>

    <linearGradient id="right-loop" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fde2e4" />
      <stop offset="40%" stop-color="#ffb5a7" />
      <stop offset="70%" stop-color="#fcd5ce" />
      <stop offset="100%" stop-color="#f8edeb" />
    </linearGradient>

    <linearGradient id="bottom-left" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#ff9aa2" />
      <stop offset="50%" stop-color="#ffb7b2" />
      <stop offset="80%" stop-color="#ffdac1" />
      <stop offset="100%" stop-color="#e2ece9" />
    </linearGradient>

    <linearGradient id="bottom-bulb" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#b5e2fa" />
      <stop offset="40%" stop-color="#c5dedd" />
      <stop offset="70%" stop-color="#edafb8" />
      <stop offset="100%" stop-color="#f7e1d7" />
    </linearGradient>

    <linearGradient id="center-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b6075" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3a2f41" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Master Glow Filters for 3D/Volumetric Illusion -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Ambient Backdrop Glow -->
  <circle cx="250" cy="400" r="220" fill="#ffccd5" opacity="0.3" filter="url(#shadow-blur)" />
  <circle cx="320" cy="300" r="180" fill="#bbf2f6" opacity="0.3" filter="url(#shadow-blur)" />

  <g transform="translate(10, 20)">
    <!-- 1. DEEP BACKDROP LAYER (Bottom Blue/Pink Bulb) -->
    <path d="M 220 500 
             C 170 560, 180 680, 260 740 
             C 340 800, 440 720, 450 620 
             C 460 520, 350 480, 310 500
             C 270 520, 240 460, 220 500 Z" 
          fill="url(#bottom-bulb)" opacity="0.9" />

    <!-- 2. LOWER LEFT ORANGE/PINK FLAP -->
    <path d="M 230 400 
             C 120 400, 30 500, 40 620 
             C 50 720, 150 780, 250 720 
             C 310 680, 270 550, 230 400 Z" 
          fill="url(#bottom-left)" filter="url(#soft-glow)" />

    <!-- 3. CENTRAL SHADOW CORE (Creates Depth Under Top Folds) -->
    <path d="M 260 350 
             C 280 420, 360 460, 340 550 
             C 310 520, 270 420, 240 380 Z" 
          fill="url(#center-shadow)" filter="url(#shadow-blur)" opacity="0.7" />

    <!-- 4. RIGHT UPPER LOOP -->
    <path d="M 280 240 
             C 340 120, 490 80, 490 240 
             C 490 380, 380 430, 340 520
             C 320 440, 320 340, 280 240 Z" 
          fill="url(#right-loop)" filter="url(#soft-glow)" />

    <!-- 5. MAIN FOREGROUND TOP FOLD (Heart/Puff Shape) -->
    <!-- Top Crest Left -->
    <path d="M 280 240 
             C 260 160, 160 160, 110 220 
             C 60 280, 70 400, 170 480 
             C 240 530, 290 450, 320 380
             C 350 320, 390 280, 360 200
             C 330 130, 290 180, 280 240 Z" 
          fill="url(#top-fold)" filter="url(#soft-glow)" />

    <!-- 6. FOREGROUND CREASE HIGHLIGHTS (Adds the Silk-Like Ridges) -->
    <path d="M 120 230 C 180 280, 240 350, 280 440" 
          stroke="#ffffff" stroke-width="6" fill="none" opacity="0.4" filter="url(#soft-glow)" />
          
    <path d="M 330 200 C 310 280, 270 380, 210 460" 
          stroke="#ffffff" stroke-width="4" fill="none" opacity="0.3" filter="url(#soft-glow)" />
  </g>
</svg>
